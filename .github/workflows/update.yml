name: Update budget data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch data from Apps Script
        run: |
          curl -L "https://script.google.com/macros/s/AKfycbx-RjlninNkwR39bqfUabK69BjDHvdZAUTyc3CqOXoibhVPKOax5XrIguewRQz1Z7Lj/exec" -o data.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "update budget data"
          git push
