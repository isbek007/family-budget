<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейный бюджет</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #f5f5f0;
  --surface:    #ffffff;
  --surface2:   #f0f0ea;
  --border:     rgba(0,0,0,0.08);
  --text:       #1a1a18;
  --muted:      #6b6b65;
  --hint:       #a0a09a;
  --green:      #1d9e75;  --green-bg: #e1f5ee;  --green-dk: #0f6e56;
  --blue:       #378add;  --blue-bg:  #e6f1fb;  --blue-dk:  #185fa5;
  --amber:      #ba7517;  --amber-bg: #faeeda;
  --red:        #d85a30;  --red-bg:   #faece7;
  --purple:     #534ab7;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#111110; --surface:#1c1c1a; --surface2:#252523;
    --border:rgba(255,255,255,0.08); --text:#f0f0ea; --muted:#8a8a84; --hint:#555550;
    --green:#5dcaa5; --green-bg:#04342c; --green-dk:#9fe1cb;
    --blue:#85b7eb;  --blue-bg:#042c53;  --blue-dk:#b5d4f4;
    --amber:#fac775; --amber-bg:#412402;
    --red:#f09575;   --red-bg:#4a1b0c;
    --purple:#afa9ec;
  }
}

body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; min-height: 100vh; }

/* HEADER */
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
.header h1 { font-size: 17px; font-weight: 600; letter-spacing: -.3px; }
.header p  { font-size: 12px; color: var(--muted); margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.badge { background: var(--green-bg); color: var(--green-dk); font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 20px; }
.refresh-btn { background: none; border: 1px solid var(--border); border-radius: var(--r-sm); padding: 5px 10px; font-size: 12px; color: var(--muted); cursor: pointer; font-family: inherit; transition: .15s; }
.refresh-btn:hover { border-color: var(--blue); color: var(--blue); }

/* LOADER */
.loader-wrap { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; padding: 80px 20px; }
.spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text { font-size: 13px; color: var(--muted); }

/* ERROR */
.error-box { background: var(--red-bg); border: 1px solid var(--red); border-radius: var(--r-md); padding: 16px 18px; margin: 20px; }
.error-box h3 { color: var(--red); font-size: 14px; margin-bottom: 6px; }
.error-box p  { font-size: 13px; color: var(--muted); }
.error-box code { font-size: 12px; background: var(--surface2); padding: 2px 6px; border-radius: 4px; }

/* MAIN LAYOUT */
.main { padding: 16px 20px; max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.section-label { font-size: 11px; font-weight: 600; color: var(--hint); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 18px; }

/* KPI */
.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px 16px; }
.kpi-label { font-size: 11px; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
.kpi-dot   { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.kpi-value { font-size: 22px; font-weight: 600; letter-spacing: -.5px; }
.kpi-plan  { font-size: 12px; color: var(--muted); margin-top: 3px; }
.kpi-bar   { height: 3px; border-radius: 2px; background: var(--border); overflow: hidden; margin-top: 8px; }
.kpi-bar-fill { height: 3px; border-radius: 2px; transition: width .6s ease; }
.kpi-status { font-size: 11px; margin-top: 5px; font-weight: 500; }
.ok   { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); }

/* TABLE */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { font-size: 11px; font-weight: 500; color: var(--muted); text-align: right; padding: 0 8px 9px; border-bottom: 1px solid var(--border); }
th:first-child { text-align: left; padding-left: 0; }
td { padding: 8px; border-bottom: 1px solid var(--border); text-align: right; vertical-align: middle; }
td:first-child { text-align: left; padding-left: 0; }
tr:last-child td { border-bottom: none; }
tfoot td { font-weight: 600; padding-top: 10px; border-top: 1px solid var(--border); border-bottom: none; }
.pos { color: var(--green); font-weight: 600; }
.neg { color: var(--red);   font-weight: 600; }
.dim { color: var(--muted); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }

/* ACCOUNTS */
.acc-inner { display: flex; align-items: center; gap: 20px; }
.donut-wrap { flex-shrink: 0; width: 110px; height: 110px; }
.acc-legend { flex: 1; }
.acc-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.acc-row:last-of-type { border-bottom: none; }
.acc-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.acc-name   { flex: 1; font-size: 13px; }
.acc-sub    { font-size: 11px; color: var(--muted); margin-top: 1px; }
.acc-amount { font-size: 13px; font-weight: 500; white-space: nowrap; }
.acc-pct    { font-size: 11px; color: var(--muted); min-width: 30px; text-align: right; }
.acc-total  { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; margin-top: 6px; border-top: 1px solid var(--border); }
.acc-total-label { font-size: 12px; font-weight: 500; color: var(--muted); }
.acc-total-value { font-size: 17px; font-weight: 600; }

/* GOALS */
.month-group  { margin-bottom: 6px; }
.month-header { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: var(--r-sm); margin-bottom: 10px; background: var(--surface2); }
.month-dot    { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.month-name   { font-size: 13px; font-weight: 600; }
.month-count  { font-size: 11px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px; }
.goal-item    { padding: 9px 0 9px 14px; border-left: 2px solid var(--border); margin-bottom: 6px; }
.goal-item:last-child { margin-bottom: 0; }
.goal-top     { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.goal-name    { font-size: 13px; font-weight: 500; }
.goal-badge   { font-size: 11px; padding: 2px 9px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
.badge-active { background: var(--green-bg); color: var(--green-dk); }
.badge-new    { background: var(--blue-bg);  color: var(--blue-dk); }
.badge-done   { background: var(--surface2); color: var(--muted); }
.goal-bar-bg  { height: 3px; border-radius: 2px; background: var(--border); overflow: hidden; margin-bottom: 6px; }
.goal-bar-fill{ height: 3px; border-radius: 2px; transition: width .6s ease; }
.goal-meta    { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.goal-per-month { font-weight: 600; color: var(--text); }

/* DATE FILTER */
.filter-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.filter-label { font-size: 11px; font-weight: 600; color: var(--hint); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
.filter-inputs { display: flex; align-items: center; gap: 8px; }
.filter-input { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 7px 11px; font-size: 13px; color: var(--text); font-family: inherit; outline: none; cursor: pointer; }
.filter-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(55,138,221,0.12); }
.filter-sep { color: var(--hint); font-size: 13px; }
.filter-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.filter-btn { background: var(--blue); color: #fff; border: none; border-radius: var(--r-sm); padding: 7px 16px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; }
.filter-btn:hover { opacity: .85; }
.filter-reset { background: none; border: 1px solid var(--border); border-radius: var(--r-sm); padding: 7px 12px; font-size: 12px; color: var(--muted); font-family: inherit; cursor: pointer; }
.filter-reset:hover { border-color: var(--red); color: var(--red); }
.filter-active { font-size: 11px; color: var(--blue-dk); font-weight: 500; background: var(--blue-bg); padding: 3px 10px; border-radius: 20px; }

/* YEAR CHART */
.chart-wrap { position: relative; height: 160px; }

/* FOOTER */
.footer { text-align: center; padding: 20px; font-size: 12px; color: var(--hint); }
.last-updated { font-size: 11px; color: var(--hint); text-align: right; margin-top: 4px; }

@media (max-width: 500px) {
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .kpi-grid .kpi:nth-child(3) { grid-column: 1 / -1; }
  .acc-inner { flex-direction: column; align-items: stretch; }
  .donut-wrap { width: 90px; height: 90px; align-self: center; }
  .header { padding: 12px 16px; }
  .main   { padding: 12px 16px; }
}
</style>
</head>
<body>

<header class="header">
  <div>
    <h1 id="header-title">Семейный бюджет</h1>
    <p id="header-sub">Загрузка...</p>
  </div>
  <div class="header-right">
    <span class="badge" id="header-badge">—</span>
    <button class="refresh-btn" onclick="loadData()">↻ Обновить</button>
  </div>
</header>

<div id="app">
  <div class="loader-wrap">
    <div class="spinner"></div>
    <div class="loader-text">Загружаем данные из Google Sheets...</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
// ВАЖНО: вставь сюда URL твоего Apps Script Web App
// Extensions → Apps Script → Deploy → New Deployment → Web App
// ══════════════════════════════════════════════════════════════════
const API_URL = 'ВСТАВЬ_СЮДА_URL_APPS_SCRIPT';

const fmt    = n => (n || 0).toLocaleString('ru-RU') + '\u00a0₽';
const pctFmt = n => Math.round((n || 0) * 100) + '%';

const MONTH_ORDER  = ['Май 2026','Июнь 2026','Июль 2026','Август 2026','Сентябрь 2026','Октябрь 2026','Ноябрь 2026','Декабрь 2026'];
const MONTH_COLORS = ['#378ADD','#1D9E75','#BA7517','#534AB7','#D85A30','#888780','#0F6E56','#185FA5'];

let donutChart = null;
let yearChart  = null;

// ── Загрузка данных ───────────────────────────────────────────────
// JSONP — единственный надёжный способ вызвать Apps Script с GitHub Pages
function loadViaJsonp(url) {
  return new Promise((resolve, reject) => {
    const cbName = '_cb_' + Date.now();
    const script = document.createElement('script');
    const timer  = setTimeout(() => {
      cleanup();
      reject(new Error('Timeout — Apps Script не ответил за 10 секунд'));
    }, 10000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('Ошибка загрузки скрипта')); };
    script.src = url + '?callback=' + cbName + '&t=' + Date.now();
    document.head.appendChild(script);
  });
}

async function loadData() {
  showLoader();

  // Читаем напрямую с raw.githubusercontent.com — без CDN кэша
  try {
    const url = 'https://raw.githubusercontent.com/isbek007/family-budget/main/data.json?t=' + Date.now();
    const res  = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderAll(data);
    return;
  } catch (err) {
    console.warn('raw fetch failed:', err.message);
    setTimeout(() => renderAll(getDemoData()), 300);
  }
}

function showLoader() {
  document.getElementById('app').innerHTML = `
    <div class="loader-wrap">
      <div class="spinner"></div>
      <div class="loader-text">Загружаем данные из Google Sheets...</div>
    </div>`;
}

function showError(err) {
  document.getElementById('app').innerHTML = `
    <div class="error-box">
      <h3>Не удалось загрузить данные</h3>
      <p>Проверь что URL Apps Script указан верно в переменной <code>API_URL</code>.</p>
      <p style="margin-top:8px;font-size:12px">Ошибка: ${err.message}</p>
    </div>`;
}

// ── Рендер всего дашборда ─────────────────────────────────────────
function renderAll(data) {
  if (donutChart) { donutChart.destroy(); donutChart = null; }
  if (yearChart)  { yearChart.destroy();  yearChart  = null; }

  const meta = data.meta || {};
  document.getElementById('header-title').textContent = 'Семейный бюджет';
  document.getElementById('header-sub').textContent   = (meta.family || '') + ' · ' + (meta.month || '');
  document.getElementById('header-badge').textContent = meta.month || '';

  document.getElementById('app').innerHTML = buildHTML();

  renderKPI(data.kpi || {});
  renderExpenses(data.expenses || []);
  renderAccounts(data.accounts || []);
  renderGoals(data.goals || []);
  renderYearChart(data.year || {});

  if (data.updated) {
    const d = new Date(data.updated);
    document.getElementById('last-updated').textContent =
      'Обновлено: ' + d.toLocaleString('ru-RU', {day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
  }
}

function buildHTML() {
  return `
  <main class="main">
    <div class="filter-bar" id="filter-bar">
      <span class="filter-label">Период</span>
      <div class="filter-inputs">
        <input class="filter-input" type="date" id="date-from" />
        <span class="filter-sep">—</span>
        <input class="filter-input" type="date" id="date-to" />
      </div>
      <div class="filter-actions">
        <span class="filter-active" id="filter-status"></span>
        <button class="filter-reset" onclick="resetFilter()">Сбросить</button>
        <button class="filter-btn" onclick="applyFilter()">Применить</button>
      </div>
    </div>

    <div>
      <div class="section-label">Ключевые показатели</div>
      <div class="kpi-grid" id="kpi-grid"></div>
      <div class="last-updated" id="last-updated"></div>
    </div>

    <div class="card">
      <div class="section-label">Расходы по категориям</div>
      <table>
        <thead>
          <tr>
            <th>Категория</th><th>План</th><th>Факт</th><th>Остаток</th>
            <th style="text-align:center">%</th><th style="text-align:center"></th>
          </tr>
        </thead>
        <tbody id="exp-tbody"></tbody>
        <tfoot><tr id="exp-total"></tr></tfoot>
      </table>
    </div>

    <div class="card">
      <div class="section-label">Состояние счетов и активов</div>
      <div class="acc-inner">
        <div class="donut-wrap"><canvas id="donutChart" role="img" aria-label="Структура активов"></canvas></div>
        <div class="acc-legend" style="flex:1">
          <div id="acc-rows"></div>
          <div class="acc-total">
            <span class="acc-total-label">Итого активов</span>
            <span class="acc-total-value" id="acc-total"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Цели</div>
      <div id="goals-container"></div>
    </div>

    <div class="card">
      <div class="section-label">Доходы и расходы по месяцам</div>
      <div class="chart-wrap"><canvas id="yearChart" role="img" aria-label="Годовой график доходов и расходов"></canvas></div>
    </div>
  </main>
  <div class="footer">Обновляй данные в Google Sheets → нажимай ↻ Обновить</div>`;
}

// ── KPI ───────────────────────────────────────────────────────────
function renderKPI(kpi) {
  const items = [
    { label:'Доходы',     color:'var(--green)', data: kpi.income  || {} },
    { label:'Расходы',    color:'var(--red)',   data: kpi.expense || {} },
    { label:'Накопления', color:'var(--blue)',  data: kpi.savings || {} },
  ];

  const grid = document.getElementById('kpi-grid');
  items.forEach(item => {
    const { plan = 0, fact = 0 } = item.data;
    const pct = plan > 0 ? Math.round(fact / plan * 100) : 0;
    const barW = Math.min(pct, 100);
    const statusCls = pct >= 95 ? 'ok' : pct >= 70 ? 'warn' : 'bad';
    const statusTxt = pct >= 95 ? `${pct}% — выполнен` : pct >= 70 ? `${pct}% — частично` : `${pct}% — ниже плана`;

    const kpiEl = document.createElement('div');
    kpiEl.className = 'kpi';
    kpiEl.innerHTML = `
      <div class="kpi-label"><span class="kpi-dot" style="background:${item.color}"></span>${item.label}</div>
      <div class="kpi-value">${fmt(fact)}</div>
      <div class="kpi-plan">план ${fmt(plan)}</div>
      <div class="kpi-bar"><div class="kpi-bar-fill" style="width:${barW}%;background:${item.color}"></div></div>
      <div class="kpi-status ${statusCls}">${statusTxt}</div>`;
    grid.appendChild(kpiEl);
  });
}

// ── Расходы по категориям ─────────────────────────────────────────
function renderExpenses(cats) {
  const tbody = document.getElementById('exp-tbody');
  let totalPlan = 0, totalFact = 0;

  cats.forEach(c => {
    const { plan = 0, fact = 0 } = c;
    totalPlan += plan; totalFact += fact;
    const diff = plan - fact;
    const pct  = plan > 0 ? Math.round(fact / plan * 100) : 0;
    const dotColor = pct > 90 ? 'var(--red)' : pct > 70 ? 'var(--amber)' : 'var(--green)';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span style="font-size:14px;margin-right:6px">${c.icon || ''}</span>${c.name}</td>
      <td class="dim">${fmt(plan)}</td>
      <td>${fact > 0 ? fmt(fact) : '<span class="dim">—</span>'}</td>
      <td class="${diff >= 0 ? 'pos' : 'neg'}">${diff >= 0 ? '+' : ''}${fmt(diff)}</td>
      <td style="text-align:center;color:var(--muted)">${pct > 0 ? pct + '%' : '—'}</td>
      <td style="text-align:center"><span class="dot" style="background:${dotColor}"></span></td>`;
    tbody.appendChild(tr);
  });

  const totalDiff = totalPlan - totalFact;
  const totalPct  = totalPlan > 0 ? Math.round(totalFact / totalPlan * 100) : 0;
  document.getElementById('exp-total').innerHTML = `
    <td>Итого</td>
    <td class="dim">${fmt(totalPlan)}</td>
    <td>${fmt(totalFact)}</td>
    <td class="${totalDiff >= 0 ? 'pos' : 'neg'}">${totalDiff >= 0 ? '+' : ''}${fmt(totalDiff)}</td>
    <td style="text-align:center">${totalPct}%</td>
    <td style="text-align:center"><span class="dot" style="background:${totalPct > 90 ? 'var(--red)' : totalPct > 70 ? 'var(--amber)' : 'var(--green)'}"></span></td>`;
}

// ── Счета ─────────────────────────────────────────────────────────
function renderAccounts(accounts) {
  const total = accounts.reduce((s, a) => s + (a.equiv || 0), 0);
  document.getElementById('acc-total').textContent = fmt(total);

  const ACC_COLORS = ['#378ADD','#1D9E75','#534AB7','#D85A30'];

  accounts.forEach((a, i) => {
    const pct = total > 0 ? Math.round((a.equiv || 0) / total * 100) : 0;
    const sub = a.qty && a.rate ? `${a.qty.toLocaleString('ru-RU')} × ${fmt(a.rate)}` : (a.comment || '');
    const color = a.color || ACC_COLORS[i] || '#888';
    const div = document.createElement('div');
    div.className = 'acc-row';
    div.innerHTML = `
      <div class="acc-dot" style="background:${color}"></div>
      <div style="flex:1">
        <div class="acc-name">${a.name}</div>
        ${sub ? `<div class="acc-sub">${sub}</div>` : ''}
      </div>
      <div class="acc-amount">${fmt(a.equiv)}</div>
      <div class="acc-pct">${pct}%</div>`;
    document.getElementById('acc-rows').appendChild(div);
  });

  donutChart = new Chart(document.getElementById('donutChart'), {
    type: 'doughnut',
    data: {
      datasets: [{
        data: accounts.map(a => a.equiv || 0),
        backgroundColor: accounts.map((a, i) => a.color || ACC_COLORS[i]),
        borderWidth: 2,
        borderColor: 'transparent',
        hoverOffset: 4
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: true, cutout: '68%',
      plugins: { legend: {display:false}, tooltip: {enabled:false} },
      animation: {duration: 700}
    }
  });
}

// ── Цели ──────────────────────────────────────────────────────────
function renderGoals(goals) {
  const container = document.getElementById('goals-container');

  const grouped = {};
  goals.forEach(g => {
    const key = g.deadline || 'Без срока';
    (grouped[key] = grouped[key] || []).push(g);
  });

  const sortedMonths = Object.keys(grouped).sort((a, b) => {
    const ia = MONTH_ORDER.indexOf(a), ib = MONTH_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return 0;
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  sortedMonths.forEach(month => {
    const items = grouped[month];
    const idx   = MONTH_ORDER.indexOf(month);
    const color = idx >= 0 ? MONTH_COLORS[idx] : '#888780';

    const grp = document.createElement('div');
    grp.className = 'month-group';
    grp.innerHTML = `
      <div class="month-header">
        <span class="month-dot" style="background:${color}"></span>
        <span class="month-name">${month}</span>
        <span class="month-count">${items.length} ${items.length === 1 ? 'цель' : 'цели'}</span>
      </div>`;

    items.forEach(g => {
      const pct      = g.target > 0 ? Math.min(Math.round((g.saved || 0) / g.target * 100), 100) : 0;
      const badgeCls = g.done ? 'badge-done' : (g.saved > 0 ? 'badge-active' : 'badge-new');
      const badgeTxt = g.done ? '✅ Готово' : (g.saved > 0 ? 'В работе' : 'Новая');
      const item = document.createElement('div');
      item.className = 'goal-item';
      item.style.borderLeftColor = g.done ? 'var(--green)' : color;
      item.innerHTML = `
        <div class="goal-top">
          <div class="goal-name">${g.name}</div>
          <span class="goal-badge ${badgeCls}">${badgeTxt}</span>
        </div>
        <div class="goal-bar-bg">
          <div class="goal-bar-fill" style="width:${pct}%;background:${g.done ? 'var(--green)' : color}"></div>
        </div>
        <div class="goal-meta">
          <span>${fmt(g.saved)} из ${fmt(g.target)}</span>
          <span class="goal-per-month">${g.perMonth > 0 ? '~' + fmt(g.perMonth) + '/мес' : '—'}</span>
        </div>`;
      grp.appendChild(item);
    });
    container.appendChild(grp);
  });
}

// ── Годовой график ────────────────────────────────────────────────
function renderYearChart(year) {
  if (!year.months || !year.months.length) return;

  yearChart = new Chart(document.getElementById('yearChart'), {
    type: 'bar',
    data: {
      labels: year.months,
      datasets: [
        {
          label: 'Доходы',
          data: year.income,
          backgroundColor: 'rgba(29,158,117,0.25)',
          borderColor: '#1d9e75',
          borderWidth: 1.5,
          borderRadius: 4,
        },
        {
          label: 'Расходы',
          data: year.expense,
          backgroundColor: 'rgba(216,90,48,0.2)',
          borderColor: '#d85a30',
          borderWidth: 1.5,
          borderRadius: 4,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'top',
          labels: { font: {size:11, family:'Manrope'}, boxWidth: 10, padding: 12,
                    color: getComputedStyle(document.body).getPropertyValue('color') || '#1a1a18' }
        },
        tooltip: {
          callbacks: {
            label: ctx => ' ' + ctx.dataset.label + ': ' + ctx.parsed.y.toLocaleString('ru-RU') + ' ₽'
          }
        }
      },
      scales: {
        x: { grid: {display:false}, ticks: {font:{size:11}} },
        y: { grid: {color:'rgba(0,0,0,0.04)'}, ticks: { font:{size:11}, callback: v => (v/1000)+'к ₽' } }
      }
    }
  });
}
